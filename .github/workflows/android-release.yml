name: Android Release
run-name: >-
  ${{ inputs.publish_release && '发布' || '构建' }}
  ${{ inputs.release_version && format('v{0}', inputs.release_version) || github.ref_name }} ·
  ${{ inputs.change_summary || '手动触发' }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "发布 GitHub Release（不勾选时仅构建签名 APK）"
        type: boolean
        default: false
      release_version:
        description: "发布时填写版本号，如 1.3.14，必须与所选分支源码一致"
        type: string
        default: ""
      change_summary:
        description: "本次修改说明；发布脚本自动读取最新提交标题"
        type: string
        default: ""

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manual release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$REQUESTED_VERSION"
          test "$REQUESTED_VERSION" = "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; increase the version before publishing."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Test and build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease \
            -PGITHUB_REPOSITORY="$GITHUB_REPOSITORY"

      - name: Prepare APK
        id: apk
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          APK_PATH="$RUNNER_TEMP/ShanRuanDrink-${VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=ShanRuanDrink-${VERSION_NAME}-release.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "v$VERSION_NAME" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "山软喝水 v$VERSION_NAME" \
            --generate-notes
